/* Layout: one-screen game, Nile-night ground, four bold answer tiles in a 2x2 grid */
:root{
  --night:#0a1833; --night-2:#132a57; --sand:#f3f7fc; --sand-dim:#a9bbd4; --gold:#35a9ec; --gold-deep:#1673ad;
  --t-red:#e0383e; --t-blue:#1d6fd1; --t-yellow:#f2b705; --t-green:#1f9d55;
  --ok:#2fbf71; --bad:#ef5350; --ink:#0a1833; --flag-r:#d21034; --flag-g:#007229;
  --display:"Cairo",Tahoma,sans-serif;
  --latin:"Cairo",Tahoma,sans-serif;
  --body:"Cairo",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--sand);font-family:var(--body);font-size:16px;direction:rtl;
  }
#poly{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
.ribbon{position:fixed;inset:0 0 auto;height:calc(6px + env(safe-area-inset-top,0px));z-index:5;background:linear-gradient(90deg,var(--flag-r) 0 25%,#fff 25% 50%,#111 50% 75%,var(--flag-g) 75%)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 auto;padding:6px 14px;border-radius:999px;background:rgba(53,169,236,.14);color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.02em}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--flag-r);box-shadow:0 0 0 3px rgba(210,16,52,.25)}
.lead{margin:0 auto;max-width:34ch;color:var(--sand-dim);line-height:1.8;font-size:17px}
.flag3d{display:block;width:210px;height:131px;margin:4px auto 0;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45))}
.end .flag3d{width:140px;height:88px}
.lockup{display:flex;align-items:center;justify-content:center;gap:14px}
.lockup .logo-tile{margin:0}
.lk-sep{width:2px;height:90px;border-radius:2px;background:rgba(169,187,212,.5)}
.flag-tile{display:flex}
.flagm{display:block;width:150px;height:75px;border-radius:4px;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.host-top .lockup{justify-content:flex-start}.host-top .lk-sep{height:56px}.host-top .flagm{width:104px;height:52px}
.end .lockup .logo-tile img{height:64px}.end .lk-sep{height:60px}.end .flagm{width:110px;height:55px}
@media (max-width:420px){.lockup .logo-tile img{height:96px}.flagm{width:128px;height:64px}.lk-sep{height:80px}}
body.on-screen .app{max-width:none;padding:0}
body.on-screen .foot{display:none}
.stage-foot{position:absolute;bottom:3cqh;left:0;right:0;text-align:center;font-size:1.5cqh;color:var(--sand-dim);direction:ltr;z-index:1}.stage-foot b{color:var(--gold)}
.stage-wrap{position:fixed;inset:0;display:grid;place-items:center;z-index:2}
.stage{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);container-type:size;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center;gap:4cqw;
  padding-block:6cqh 9cqh;padding-left:5cqw;padding-right:5cqw;box-sizing:border-box;overflow:hidden}
.stage::after{content:"";position:absolute;inset:auto 0 0;height:1.4cqh;background:linear-gradient(90deg,var(--flag-r) 0 25%,#fff 25% 50%,#111 50% 75%,var(--flag-g) 75%)}
#amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.stage-copy,.stage-join{position:relative;z-index:1;min-width:0}
.stage-copy{display:flex;flex-direction:column;gap:2.4cqh;align-items:flex-start;text-align:start}
.stage .lockup{justify-content:flex-start;gap:2cqw}
.stage .logo-tile img{height:17cqh}
.stage .flagm{width:22cqh;height:11cqh}
.stage .lk-sep{height:15cqh}
.stage-date{display:inline-flex;align-items:center;gap:12px;font-size:2.6cqh;font-weight:700;color:var(--gold);letter-spacing:.02em}
.stage-date::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--flag-r);box-shadow:0 0 0 5px rgba(210,16,52,.25)}
.stage-title{font-size:11cqh;line-height:1.2;font-weight:900;margin:0;text-align:start}
.stage-title em{font-style:normal;color:var(--gold)}
.stage-sub{margin:0;max-width:30ch;font-size:2.6cqh;line-height:1.7;color:var(--sand-dim)}
.stage-card{background:#fff;color:var(--ink);border-radius:28px;padding:3.2cqh 2.6cqw;display:flex;flex-direction:column;align-items:center;gap:1.8cqh;box-shadow:0 30px 70px rgba(0,0,0,.45);max-width:34cqw;margin-inline:auto;border-radius:2.6cqh}
.stage-qr{width:44cqh;height:auto;aspect-ratio:1;max-width:100%;image-rendering:pixelated}
.stage-step{display:flex;align-items:center;gap:10px;font-weight:700;font-size:2.4cqh}
.stage-step span{width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:.85em}
.stage-code{direction:ltr;display:flex;gap:1cqw}
.stage-code b{display:grid;place-items:center;width:9cqh;height:11cqh;border-radius:16px;background:var(--ink);color:#fff;font-size:7.5cqh;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:inset 0 -6px 0 rgba(53,169,236,.6)}
.stage-tools{position:fixed;z-index:3;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:8px;opacity:.35;transition:opacity .2s}
.stage-tools:hover,.stage-tools:focus-within{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes popin{0%{opacity:0;transform:scale(.6) rotate(-6deg)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(-60px) rotate(-2deg)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glow{0%,100%{box-shadow:inset 0 -6px 0 rgba(53,169,236,.6),0 0 0 rgba(53,169,236,0)}50%{box-shadow:inset 0 -6px 0 rgba(53,169,236,.9),0 0 26px rgba(53,169,236,.55)}}
@keyframes shine{0%{background-position:-150% 0}60%,100%{background-position:250% 0}}
@keyframes wave{0%,100%{transform:perspective(500px) rotateY(-10deg) skewY(-1deg)}50%{transform:perspective(500px) rotateY(8deg) skewY(1.5deg)}}
.stage .lockup{animation:rise .8s .1s both}
.stage-date{animation:rise .8s .35s both}
.stage-title{animation:rise .9s .5s both}
.stage-title em{background:linear-gradient(100deg,var(--gold) 40%,#fff 50%,var(--gold) 60%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4.5s 1.6s infinite}
.stage-sub{animation:rise .9s .7s both}
.stage-card{animation:slidein 1s .4s both,float 6s 1.6s ease-in-out infinite}
.stage-code b{animation:popin .6s both,glow 2.8s ease-in-out infinite}
.stage-code b:nth-child(1){animation-delay:1s,1.8s}.stage-code b:nth-child(2){animation-delay:1.12s,2.1s}.stage-code b:nth-child(3){animation-delay:1.24s,2.4s}.stage-code b:nth-child(4){animation-delay:1.36s,2.7s}
@media (prefers-reduced-motion:reduce){.stage *{animation:none!important}}
.score small{font-size:.4em;color:var(--sand-dim)}
.pboard{text-align:start}.ranks li.me{outline:2px solid var(--gold);outline-offset:-2px}
.pubstat{font-size:14px;color:var(--gold);min-height:1.2em}
.rankstage{grid-template-columns:1fr!important;grid-template-rows:auto 1fr;align-items:stretch!important;gap:3cqh!important}
.rank-head{position:relative;z-index:1;display:flex;align-items:center;gap:4cqw}
.rank-head .stage-title{font-size:9cqh}
.rank-body{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:4cqw;align-items:end;min-height:0}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1.6cqw;height:100%}
.pod{flex:1;display:flex;flex-direction:column;align-items:center;gap:1cqh;min-width:0;animation:rise .9s both}
.pod.p1{animation-delay:.2s}.pod.p0{animation-delay:.5s}.pod.p2{animation-delay:.1s}
.pod-name{font-size:3.4cqh;font-weight:800;text-align:center;line-height:1.3;overflow-wrap:anywhere}
.pod-score{font-size:5cqh;font-weight:900;color:var(--gold);line-height:1}
.pod-block{width:100%;border-radius:2cqh 2cqh 0 0;display:grid;place-items:start center;padding-top:2cqh;box-sizing:border-box}
.pod-block span{font-size:8cqh;font-weight:900;color:var(--ink);line-height:1}
.p0 .pod-block{height:34cqh;background:linear-gradient(#f9d86a,#e6b422)}
.p1 .pod-block{height:25cqh;background:linear-gradient(#e7ecf2,#b7c1cd)}
.p2 .pod-block{height:19cqh;background:linear-gradient(#e0a173,#b06d3f)}
.pod.empty .pod-block{opacity:.25}
.rank-rest{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1cqh;font-variant-numeric:tabular-nums}
.rank-rest li{display:flex;align-items:center;gap:1.4cqw;background:rgba(19,42,87,.85);border:1px solid rgba(120,180,230,.2);border-radius:1.4cqh;padding:1.1cqh 1.4cqw;font-size:2.8cqh;font-weight:700}
.rank-rest .pos{width:4.2cqh;height:4.2cqh;border-radius:50%;display:grid;place-items:center;background:var(--night);flex:none}
.rank-rest .nm{flex:1;min-width:0;overflow-wrap:anywhere}.rank-rest .sc{color:var(--gold)}
.stage-meta{font-size:2.4cqh;font-weight:700;color:var(--gold-deep);background:#eaf4fc;border-radius:999px;padding:.8cqh 2cqw}
.formrow{display:flex;flex-direction:column;gap:6px}.formrow label{font-weight:700;font-size:14px}
.formrow input{direction:ltr;text-align:left}
.submit-btn{display:block;text-align:center;text-decoration:none;font-size:20px;padding:16px 28px}
.mute{background:var(--night-2);border:0;border-radius:999px;width:38px;height:34px;font-size:17px;flex:none;color:var(--sand)}
.hint.err{color:var(--bad);font-weight:700;min-height:0}
.sendstat{font-weight:700;color:var(--ok);min-height:1.4em}.sendstat .btn{margin-inline-start:8px}
.tblwrap{overflow-x:auto;max-height:340px;overflow-y:auto;border-radius:10px}
.alltbl{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.alltbl th,.alltbl td{padding:8px 10px;text-align:start;border-bottom:1px solid rgba(169,187,212,.15)}
.alltbl th{position:sticky;top:0;background:var(--night-2);color:var(--sand-dim);font-weight:700}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
.app{min-height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
h1,h2{font-family:var(--display);font-weight:600;line-height:1.5;text-wrap:balance;margin:0;color:var(--sand)}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn{background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:14px 28px;font-size:18px;font-weight:700;
  box-shadow:0 4px 0 var(--gold-deep),0 10px 24px rgba(53,169,236,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep)}
.btn.ghost{background:transparent;color:var(--sand);box-shadow:none;border:2px solid var(--sand-dim)}
/* start */
.start{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;text-align:center}
.pyr{display:flex;justify-content:center;align-items:flex-end;gap:6px;height:64px}
.pyr i{display:block;width:0;height:0;border-left:var(--w) solid transparent;border-right:var(--w) solid transparent;border-bottom:calc(var(--w)*1.7) solid var(--gold);opacity:.9}
.start h1{font-size:clamp(34px,8vw,56px);line-height:1.15}

.opts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.chip{background:transparent;border:2px solid var(--sand-dim);color:var(--sand);border-radius:999px;padding:8px 18px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--sand);color:var(--ink);border-color:var(--sand)}
.best{font-size:14px;color:var(--sand-dim)}
.brand{direction:ltr;display:flex;justify-content:center;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--sand-dim)}

.lobby{flex:1;display:flex;flex-direction:column;gap:22px;justify-content:center}
.lobby-head{display:flex;flex-direction:column;gap:12px;text-align:center}
.lobby-head h1{font-size:clamp(32px,8vw,56px);line-height:1.25;font-weight:700}
.lobby-head h1 em{font-style:normal;color:var(--gold)}
.lobby-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.qr-panel{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.qr-cap{font-weight:700;max-width:240px;line-height:1.5}
.qr-url{direction:ltr;font-size:12px;color:var(--sand-dim);word-break:break-all;max-width:240px;user-select:all}

.join{background:rgba(19,42,87,.82);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.35);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}

.host{display:flex;flex-direction:column;gap:20px}
.host-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}

.feedback{border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;line-height:1.7}
.feedback.ok{background:rgba(79,179,106,.16);border:2px solid var(--ok)}
.feedback.bad{background:rgba(217,83,59,.16);border:2px solid var(--bad)}
.feedback b{font-family:var(--display);font-size:22px}
.fb-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
/* end */
.end{display:flex;flex-direction:column;gap:18px;text-align:center}
.score{font-family:var(--display);font-size:clamp(52px,14vw,88px);color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.rank{font-size:20px;font-weight:700}
.review{text-align:start;display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.review li{background:var(--night-2);border-radius:10px;padding:12px 14px;display:flex;gap:10px;line-height:1.6}
.review .m{flex:none;font-weight:700;width:22px}
.review .m.y{color:var(--ok)}.review .m.n{color:var(--bad)}
.review small{color:var(--sand-dim)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
.pop{animation:pop .25s ease-out}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.btn,.ans{transition:none}}

let flagRAF=0;
function flagWave(){
  cancelAnimationFrame(flagRAF);
  const cs=[...document.querySelectorAll("canvas.flag3d")];if(!cs.length)return;
  const d=Math.min(2,devicePixelRatio||1),W=240,Hh=150,FW=200,FH=100,ox=24,oy=22;
  const off=document.createElement("canvas");off.width=FW*d;off.height=FH*d;const o=off.getContext("2d");o.scale(d,d);
  [["#d21034",0],["#ffffff",1],["#111111",2]].forEach(([c,i])=>{o.fillStyle=c;o.fillRect(0,i*FH/3,FW,FH/3+.5)});
  o.fillStyle="#007229";o.beginPath();o.moveTo(0,0);o.lineTo(FW*.38,FH/2);o.lineTo(0,FH);o.closePath();o.fill();
  cs.forEach(c=>{c.width=W*d;c.height=Hh*d});
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const draw=t=>{
    cs.forEach(c=>{if(!c.isConnected)return;const x=c.getContext("2d");x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,Hh);
      const L=210,x0=14,top=[],bot=[];
      for(let i=0;i<=FW;i+=1.5){const k=i/FW,ph=k*4.2-t*.0026;
        const h=FH*.82*(1-.42*k)*(.78+.22*Math.cos(ph*1.1));
        const cy=Hh*.62-k*k*58+Math.sin(ph)*7*(.3+k);
        const sx=x0+k*L,sw=L/FW*1.5+.8;
        if(i<FW)x.drawImage(off,Math.min(i,FW-1.5)*d,0,1.5*d,FH*d,sx,cy-h/2,sw,h);
        top.push([sx,cy-h/2]);bot.push([sx,cy+h/2])}
      x.save();x.beginPath();top.forEach((p,j)=>j?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));
      for(let j=bot.length-1;j>=0;j--)x.lineTo(bot[j][0],bot[j][1]);x.closePath();x.clip();
      const r=rng(7),st=22,cols=Math.ceil(W/st)+2,rows=Math.ceil(Hh/st)+2,P=[];
      for(let j=0;j<rows;j++){P[j]=[];for(let i=0;i<cols;i++)P[j][i]=[(i-.5)*st+(r()-.5)*st*.8,(j-.5)*st+(r()-.5)*st*.8]}
      x.lineWidth=1;x.strokeStyle="rgba(255,255,255,.55)";
      const tri=(A,B,C)=>{x.beginPath();x.moveTo(A[0],A[1]);x.lineTo(B[0],B[1]);x.lineTo(C[0],C[1]);x.closePath();
        const v=r();x.fillStyle=v<.5?`rgba(255,255,255,${v*.32})`:`rgba(0,0,0,${(v-.5)*.36})`;x.fill();x.stroke()};
      for(let j=0;j<rows-1;j++)for(let i=0;i<cols-1;i++){const A=P[j][i],B=P[j][i+1],C=P[j+1][i],D=P[j+1][i+1];if(r()<.5){tri(A,B,D);tri(A,D,C)}else{tri(A,B,C);tri(B,D,C)}}
      x.restore();
      x.lineWidth=1.5;x.strokeStyle="rgba(255,255,255,.7)";x.beginPath();top.forEach((p,j)=>j?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));
      for(let j=bot.length-1;j>=0;j--)x.lineTo(bot[j][0],bot[j][1]);x.closePath();x.stroke()});
  };
  draw(1700);
}
let IS_OWNER=null;
async function showHostIfOwner(){
  const el=()=>document.getElementById("hostlinks");
  if(location.hash==="#host"){IS_OWNER=true}
  if(IS_OWNER===null){try{const u=window.claude&&await window.claude.use("user");IS_OWNER=u?await u.isOwner():false}catch(e){IS_OWNER=false}}
  const h=el();if(h)h.hidden=!IS_OWNER;
}
function head(){return `<div class="lobby-head">${LOCKUP()}<span class="eyebrow">عيد استقلال السودان · 1 يناير 1956</span><h1>قد إيه تعرف عن <em>السودان</em>؟</h1><p class="lead">تحدي أسئلة من Leventis: 20 سؤال عن تاريخ السودان، وكل إجابة صح بـ 10 نقاط.</p></div>`}
function startScreen(){
  CUR_VIEW="lobby";
  try{SFX.stopBed(true)}catch(e){}
  clearInterval(S.timer);
  app.innerHTML=`<section class="lobby pop">${head()}
    <form class="join" id="join" autocomplete="off">
      <label for="team">اسم الفريق</label>
      <input id="team" maxlength="24" placeholder="مثلاً: فريق النيل الأزرق" value="${esc(S.team||"")}" required>
      <button class="btn" type="submit">ادخل اللعبة</button>
      <p class="hint">20 سؤال، وكل إجابة صح بـ 10 نقاط. كل لاعب بياخد أسئلة بترتيب مختلف، والترتيب بيظهر هنا للكل.</p><p class="hint err" id="teamerr" role="alert"></p>
    </form>
    <div class="board pboard" id="lobbyboard" ${getBoard().length?"":"hidden"}><h3>ترتيب الفرق</h3><div class="lb">${getBoard().length?boardList(getBoard(),S.team,10):""}</div></div>
    <div class="row host-links" id="hostlinks" hidden><button class="btn sm" id="screenbtn">شاشة العرض</button><button class="btn ghost sm" id="host">لوحة المضيف والترتيب</button></div>
  </section>`;
  const t=document.getElementById("team");
  t.oninput=()=>S.team=t.value;
  document.getElementById("join").onsubmit=async e=>{e.preventDefault();const name=t.value.trim().replace(/\s+/g," "),er=document.getElementById("teamerr"),btn=e.submitter||document.querySelector("#join .btn");
    if(!name){t.focus();return}er.textContent="";
    if(API){const old=btn.textContent;btn.disabled=true;btn.textContent="بنتأكد من الاسم…";
      await Promise.race([liveFetch(false),new Promise(r=>setTimeout(r,4000))]);btn.disabled=false;btn.textContent=old;
      if(getBoard().some(r=>normName(r.t)===normName(name))){er.textContent="الاسم «"+name+"» اتسجّل قبل كده. اختار اسم تاني لفريقك.";t.focus();t.select();return}}
    S.team=name;S.code=SEED;newGame()};
  document.getElementById("host").onclick=()=>hostScreen(true);
  showHostIfOwner();
  livePoll("lobby",20000);
  document.getElementById("screenbtn").onclick=()=>{H=hostLoad()||{code:String(1000+Math.floor(Math.random()*9000)),board:[]};hostSave(H);screenView()};

  
}

let H=null;

function parseForm(u){
  try{const x=new URL(u);if(!/docs\.google\.com$|forms\.gle$/.test(x.hostname))return null;
    const e=[...x.searchParams.entries()].filter(([k])=>/^entry\.\d+$/.test(k));if(e.length<2)return null;
    let name=null,score=null,correct=null;
    e.forEach(([k,v])=>{v=v.trim();if(v==="100")score=k;else if(v==="10")correct=k;else name=name||k});
    if(!name||!score)return null;return{base:x.origin+x.pathname,name,score,correct}}catch(err){return null}
}
const normName=x=>String(x).trim().replace(/\s+/g," ").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").toLowerCase();
const API="https://script.google.com/macros/s/AKfycbxcyacXEFcps7vXuIiwvW-qnmym3imNTIRpyJv_6yNF5i6RTH4BIgZkn1QUjdBAY4wr/exec";
let LIVE={board:null,all:null,count:0,at:0},liveT=0;
const getBoard=()=>LIVE.board||SHARED.board||[];
async function liveFetch(all){
  if(!API)return false;
  try{const r=await fetch(API+(all?"?all=1":""),{cache:"no-store"});const j=await r.json();if(!j.ok)return false;
    LIVE.board=j.board;LIVE.count=j.count;LIVE.at=Date.now();if(all)LIVE.all=j.all;return true}catch(e){return false}
}
function livePoll(view,every){clearTimeout(liveT);const tick=async()=>{if(CUR_VIEW!==view)return;
  const ok=await liveFetch(view==="host");if(ok&&CUR_VIEW===view)liveRender(view);liveT=setTimeout(tick,every)};tick()}
function liveRender(v){
  if(v==="lobby"){const el=document.getElementById("lobbyboard");if(el){const b=getBoard();el.hidden=!b.length;el.querySelector(".lb").innerHTML=boardList(b,S.team,10)}}
  else if(v==="end"){const el=document.getElementById("endboard");if(el){const b=getBoard();el.innerHTML=b.length?boardList(b,S.team,10):'<p class="hint">الترتيب هيظهر هنا أول ما الفرق تخلص.</p>'}}
  else if(v==="rank")rankView(true);
  else if(v==="host")renderLive();
}
const sentKey=()=>"sudanSent:"+S.team+":"+S.score+":"+S.log.length;
async function submitScore(){
  const st=document.getElementById("sendstat");if(!API){if(st)st.textContent="";return}
  let done=false;try{done=sessionStorage.getItem(sentKey())==="1"}catch(e){}
  if(done){if(st)st.textContent="نتيجتك متسجلة في الترتيب ✓";return}
  if(st)st.textContent="بنسجّل نتيجتك…";
  try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({team:S.team,score:S.score,correct:S.correct,device:(navigator.platform||"").slice(0,40)})});
    const j=await r.json();if(!j.ok)throw 0;try{sessionStorage.setItem(sentKey(),"1")}catch(e){}
    if(st)st.innerHTML="نتيجتك اتسجلت في الترتيب ✓";await liveFetch(false);liveRender("end");
  }catch(e){if(st)st.innerHTML='مقدرناش نسجّل النتيجة. <button class="btn sm" id="resend">جرّب تاني</button>';const b=document.getElementById("resend");if(b)b.onclick=submitScore}
}
function renderLive(){
  const ol=document.getElementById("ranks"),tb=document.getElementById("alltb"),cnt=document.getElementById("allcount");if(!ol)return;
  const b=getBoard();
  ol.innerHTML=b.length?b.map((r,i)=>`<li class="${i<3?"top t"+i:""}"><span class="pos">${i+1}</span><span class="nm">${esc(r.t)}</span><span class="sc">${r.s}</span></li>`).join(""):'<li class="empty">لسه محدش خلّص. النتايج بتظهر هنا لوحدها.</li>';
  if(cnt)cnt.textContent=LIVE.count?`${LIVE.count} نتيجة متسجلة · ${b.length} فريق · آخر تحديث ${new Date(LIVE.at).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}`:"";
  if(tb)tb.innerHTML=(LIVE.all||[]).map(r=>`<tr><td>${new Date(r.at).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})}</td><td>${esc(r.t)}</td><td>${r.s}</td><td>${r.c}/20</td></tr>`).join("")||'<tr><td colspan="4" class="hint">مفيش نتايج لسه.</td></tr>';
}
function formLink(){
  const q=new URLSearchParams();q.set("team",S.team);q.set("score",String(S.score));q.set("correct",String(S.correct));
  return JOTFORM+"?"+q.toString();
}
function boardList(board,me,limit){
  const rows=board.slice().sort((a,b)=>b.s-a.s);let out=rows.slice(0,limit);
  const mi=rows.findIndex(r=>r.t===me);if(mi>=limit)out=out.concat([rows[mi]]);
  return `<ol class="ranks">${out.map(r=>{const i=rows.indexOf(r);return `<li class="${i<3?"top t"+i:""}${r.t===me?" me":""}"><span class="pos">${i+1}</span><span class="nm">${esc(r.t)}</span><span class="sc">${r.s}</span></li>`}).join("")}</ol>`;
}
const saveGame=v=>{try{sessionStorage.setItem("sudanGame",JSON.stringify({v,team:S.team,code:S.code,seed:S.seed,score:S.score,correct:S.correct,log:S.log}))}catch(e){}};
const clearGame=()=>{try{sessionStorage.removeItem("sudanGame")}catch(e){}};
function resumeGame(){
  let g=null;try{g=JSON.parse(sessionStorage.getItem("sudanGame"))}catch(e){}
  if(!g||!g.code)return false;
  S.seed=g.seed||(+g.code*7919);const r=rng(S.seed);
  Object.assign(S,{team:g.team,code:g.code,rand:r,list:shuffleR(QS,r).slice(0,ROUND),score:g.score,correct:g.correct,log:g.log||[]});
  for(let k=0;k<S.log.length&&k<S.list.length;k++)shuffleR([0,1,2,3],r);
  S.i=S.log.length;endScreen.done=g.v==="end";
  if(S.i>=S.list.length)endScreen();else question();
  return true;
}
document.addEventListener("keydown",e=>{
  if(S.locked||!document.getElementById("ans0"))return;
  const n="1234".indexOf(e.key);if(n>=0)document.getElementById("ans"+n).click();
});
function drawPoly(){
  const c=document.getElementById("poly");if(!c)return;const d=Math.min(2,window.devicePixelRatio||1),W=innerWidth,Hh=innerHeight;
  c.width=W*d;c.height=Hh*d;const x=c.getContext("2d");x.scale(d,d);
  const navy=["#0a1833","#0d1f42","#10264f","#0b1c3b","#13305f","#0e2348"];
  const FLAG={r:["#d21034","#c00e2f","#e33a52","#a90c27"],w:["#ffffff","#eef2f7","#dbe3ee","#f6f8fb"],k:["#121212","#1e1e1e","#2b2b2b","#080808"],g:["#007229","#0b8a3b","#005d21","#17a04a"]};
  const step=Math.max(38,Math.min(W,1200)/18),cols=Math.ceil(W/step)+2,rows=Math.ceil(Hh/step)+2,r=rng(42),pts=[];
  for(let j=0;j<rows;j++){pts[j]=[];for(let i=0;i<cols;i++)pts[j][i]=[(i-.5)*step+(r()-.5)*step*.75,(j-.5)*step+(r()-.5)*step*.75]}
  const base=Math.min(Hh,W*1.6);
  const flagAt=(px,py)=>{const u=px/W;if(u<-.05||u>1.05)return null;
    const cy=base*(.33-.17*u)+Math.sin(u*Math.PI*1.3)*base*.035,hh=base*(.095-.035*u);
    const v=(py-(cy-hh))/(2*hh);if(v<0||v>1)return null;
    if(u<.3*(1-Math.abs(2*v-1)))return "g";return v<1/3?"r":v<2/3?"w":"k"};
  const tri=(a,b,e)=>{x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.lineTo(e[0],e[1]);x.closePath();
    const f=null,pick=r();
    if(f){x.fillStyle=FLAG[f][Math.floor(pick*4)];x.globalAlpha=1;x.fill();x.strokeStyle="rgba(255,255,255,.55)";x.lineWidth=1.2;x.stroke()}
    else{x.fillStyle=navy[Math.floor(pick*navy.length)];x.globalAlpha=1;x.fill();x.strokeStyle="rgba(120,180,230,.08)";x.lineWidth=1;x.stroke()}};
  for(let j=0;j<rows-1;j++)for(let i=0;i<cols-1;i++){const a=pts[j][i],b=pts[j][i+1],e=pts[j+1][i],f=pts[j+1][i+1];if(r()<.5){tri(a,b,f);tri(a,f,e)}else{tri(a,b,e);tri(b,f,e)}}
}
const FLAGC={r:["#d21034","#c00e2f","#e33a52","#a90c27"],w:["#ffffff","#eef2f7","#dbe3ee","#f6f8fb"],k:["#121212","#1e1e1e","#2b2b2b","#080808"],g:["#007229","#0b8a3b","#005d21","#17a04a"]};
function drawFlags(){
  document.querySelectorAll("canvas.flagm").forEach(c=>{
    const d=Math.min(2,devicePixelRatio||1),W=192,Hh=96;c.width=W*d;c.height=Hh*d;const x=c.getContext("2d");x.scale(d,d);
    const r=rng(11),sx=W/10,sy=Hh/6,cols=12,rows=7,P=[];
    for(let j=0;j<rows;j++){P[j]=[];for(let i=0;i<cols;i++){const edgeY=j%2===0;
      P[j][i]=[(i-1)*sx+(i>1&&i<cols-1?(r()-.5)*sx*.8:0),j*sy+(edgeY?0:(r()-.5)*sy*.7)]}}
    const at=(px,py)=>{const u=px/W,v=py/Hh;if(u<.36*(1-Math.abs(2*v-1)))return"g";return v<1/3?"r":v<2/3?"w":"k"};
    x.save();x.beginPath();x.roundRect?x.roundRect(0,0,W,Hh,10):x.rect(0,0,W,Hh);x.clip();
    x.lineWidth=1.2;x.strokeStyle="rgba(255,255,255,.6)";
    const tri=(A,B,C)=>{x.beginPath();x.moveTo(A[0],A[1]);x.lineTo(B[0],B[1]);x.lineTo(C[0],C[1]);x.closePath();
      x.fillStyle=FLAGC[at((A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3)][Math.floor(r()*4)];x.fill();x.stroke()};
    for(let j=0;j<rows-1;j++)for(let i=0;i<cols-1;i++){const A=P[j][i],B=P[j][i+1],C=P[j+1][i],D=P[j+1][i+1];if(r()<.5){tri(A,B,D);tri(A,D,C)}else{tri(A,B,C);tri(B,D,C)}}
    x.restore()});
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("confetti"),x=c.getContext("2d"),d=Math.min(2,devicePixelRatio||1);
  c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);
  const cols=["#35a9ec","#1d6fd1","#ffffff","#d21034","#007229","#f5c542"];
  const P=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,innerWidth,innerHeight);const k=t-t0;
    P.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-k/3200);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(k<3200)requestAnimationFrame(f);else x.clearRect(0,0,innerWidth,innerHeight)})(t0);
}
let BOOT_VIEW=null;try{BOOT_VIEW=sessionStorage.getItem("sudanView");sessionStorage.removeItem("sudanView")}catch(e){}
if(location.hash==="#screen"||location.hash==="#rank"||location.hash==="#host"||BOOT_VIEW){H=hostLoad()||{code:String(1000+Math.floor(Math.random()*9000)),board:[]};hostSave(H)}
drawPoly();addEventListener("resize",()=>{clearTimeout(drawPoly.t);drawPoly.t=setTimeout(drawPoly,150)});
if(BOOT_VIEW==="host"||location.hash==="#host")hostScreen(true);else if(BOOT_VIEW==="screen"||location.hash==="#screen")screenView();else if(BOOT_VIEW==="rank"||location.hash==="#rank")rankView();else if(!resumeGame())startScreen();
</script>
